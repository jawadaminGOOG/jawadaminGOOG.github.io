<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-d962a70b-801c-4e96-83de-0e0f7cfa79a7/styles.css">
</helmet>
<div style="width:100%;height:100%;container-type:inline-size;position:relative;overflow:hidden;background:{{ d.bg }};color:{{ d.ink }};font-family:var(--font-body)">

<sc-if value="{{ isCover }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;right:-7cqw;top:-10cqw;width:46cqw;height:46cqw;border-radius:50%;background:{{ d.accent }}"></div>
  <div style="position:absolute;left:7cqw;top:7cqw;font:600 1.5cqw/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase">{{ d.event }}</div>
  <div style="position:absolute;left:7cqw;bottom:7cqw;max-width:62cqw;display:flex;flex-direction:column;gap:2.2cqw">
    <div style="font:400 7.4cqw/1.04 var(--font-heading);letter-spacing:-.015em;text-wrap:balance">{{ d.title }}</div>
    <div style="font:400 1.9cqw/1.3 var(--font-body)">{{ d.author }}</div>
  </div>
</sc-if>

<sc-if value="{{ isStatement }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:7cqw;display:flex;flex-direction:column;justify-content:space-between">
    <div style="width:4.4cqw;height:4.4cqw;border-radius:50%;background:{{ d.accent }}"></div>
    <div style="max-width:74cqw;font:400 5.2cqw/1.16 var(--font-heading);letter-spacing:-.01em;text-wrap:pretty">{{ s.title }}</div>
  </div>
</sc-if>

<sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:7cqw;display:grid;grid-template-columns:1fr 1.25fr;gap:6cqw;align-items:center">
    <div style="font:400 4.4cqw/1.1 var(--font-heading);text-wrap:balance">{{ s.title }}</div>
    <div style="display:flex;flex-direction:column;gap:2.6cqw">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:2.4cqw">
          <span style="flex:none;width:4.4cqw;height:4.4cqw;border-radius:50%;background:{{ d.accent }};color:{{ accentInk }};display:grid;place-items:center;font:700 1.7cqw/1 var(--font-body)">{{ it.n }}</span>
          <span style="font:400 2.4cqw/1.35 var(--font-body)">{{ it.t }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isNumber }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;right:8cqw;top:8cqw;width:16cqw;height:16cqw;border-radius:50%;background:{{ d.accent }}"></div>
  <div style="position:absolute;inset:7cqw;display:flex;align-items:flex-end;justify-content:space-between;gap:5cqw">
    <div style="font:400 24cqw/.82 var(--font-heading);letter-spacing:-.03em">{{ s.title }}</div>
    <div style="max-width:28cqw;font:400 2.4cqw/1.4 var(--font-body);padding-bottom:1.4cqw;text-wrap:pretty">{{ s.body }}</div>
  </div>
</sc-if>

<sc-if value="{{ isImage }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:7cqw;display:grid;grid-template-columns:1fr 1.7fr;gap:5cqw">
    <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:1.6cqw">
      <div style="font:600 1.4cqw/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase">Figure</div>
      <div style="font:400 3.6cqw/1.12 var(--font-heading);text-wrap:balance">{{ s.title }}</div>
    </div>
    <div style="border-radius:3.2cqw;background:repeating-linear-gradient(135deg, {{ stripeA }} 0 1.2cqw, {{ stripeB }} 1.2cqw 2.4cqw);display:grid;place-items:center">
      <span style="font:400 1.4cqw/1 ui-monospace,Menlo,monospace;padding:1cqw 1.8cqw;border-radius:999px;background:{{ d.bg }}">{{ s.label }}</span>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isQuote }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:7cqw;display:flex;flex-direction:column;justify-content:center;gap:3cqw;max-width:76cqw">
    <div style="font:400 12cqw/.5 var(--font-heading);color:{{ d.accent }};height:5cqw">“</div>
    <div style="font:400 4.4cqw/1.2 var(--font-heading);text-wrap:pretty">{{ s.title }}</div>
    <div style="font:400 1.9cqw/1.3 var(--font-body)">{{ s.attr }}</div>
  </div>
</sc-if>

<sc-if value="{{ isShot }}" hint-placeholder-val="{{ false }}">
  <img src="{{ s.src }}" alt="{{ s.alt }}" decoding="async" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
</sc-if>

<sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;right:-12cqw;bottom:-18cqw;width:58cqw;height:58cqw;border-radius:50%;background:{{ d.accent }}"></div>
  <div style="position:absolute;left:7cqw;bottom:7cqw;display:flex;flex-direction:column;gap:2cqw">
    <div style="font:400 9cqw/1 var(--font-heading);letter-spacing:-.02em">Thank you</div>
    <div style="font:400 2cqw/1.3 var(--font-body)">{{ d.contact }}</div>
  </div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:360},&quot;slide&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;deck&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.slide || {}, d = this.props.deck || {}, t = s.type;
    return {
      s, d, accentInk: d.accentInk ?? d.bg,
      items: (s.items || []).map((x, k) => ({ n: k + 1, t: x })),
      stripeA: `color-mix(in srgb, ${d.ink} 10%, transparent)`,
      stripeB: `color-mix(in srgb, ${d.ink} 4%, transparent)`,
      isCover: t === 'cover', isStatement: t === 'statement', isList: t === 'list',
      isNumber: t === 'number', isImage: t === 'image', isQuote: t === 'quote', isEnd: t === 'end', isShot: t === 'shot'
    };
  }
}
</script>
</body>
</html>
